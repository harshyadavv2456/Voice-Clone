name: Clone my voice (encrypted output)
on:
  workflow_dispatch:
    inputs:
      text:
        description: Text to speak in your reference voice (max 1500 characters)
        required: true
        type: string
      language:
        description: Output language supported by Qwen3-TTS
        required: true
        type: choice
        options: [English, Chinese, Japanese, Korean, German, French, Russian, Portuguese, Spanish, Italian]
permissions:
  contents: read
concurrency:
  group: voice-clone-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthesize:
    name: Generate speech and encrypt output
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      TARGET_TEXT: ${{ inputs.text }}
      OUTPUT_LANGUAGE: ${{ inputs.language }}
      VOICE_SOURCE_KEY: ${{ secrets.VOICE_SOURCE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Generate speech
        run: python scripts/clone_voice.py
      - name: Encrypt output before upload
        run: python scripts/encrypt_output.py
      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-voice-output
          path: artifact/voice-output.vcenc
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary files
        if: always()
        run: |
          rm -rf work output artifact
          rm -f work-output.tar.gz
